name: Auto Publish BD Job Circulars to Blogger

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-post-jobs:
    runs-on: ubuntu-latest
    env:
      ENABLE_AUTO_SCRAPER: "false"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python & HarfBuzz/Raqm for Bangla Banner
        run: |
          sudo apt-get update
          sudo apt-get install -y libharfbuzz-dev libfribidi-dev libraqm-dev
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Publish curated posts from Google Drive / local queue
        id: verified_queue
        env:
          BLOGGER_BLOG_ID: "3244474783562745180"
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_IS_DRAFT: "false"
          FB_PAGE_ID: "104790438452242"
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          DRIVE_QUEUE_URL: "https://drive.google.com/uc?export=download&id=1kePEcfzrmtt4MYZ5YWKpxObJ9_lzbCXB"
          MAX_QUEUE_POSTS_PER_RUN: ${{ github.event_name == 'workflow_dispatch' && '30' || '5' }}
          IGNORE_COOLDOWN: "true"
        run: python3 publish_verified_post_queue.py

      - name: Run Auto Job Circular Scraper & Blogger Publisher
        if: env.ENABLE_AUTO_SCRAPER == 'true' && steps.verified_queue.outputs.slot_consumed != 'true'
        env:
          BLOGGER_BLOG_ID: "3244474783562745180"
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_PAGE_ID: "104790438452242"
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          BLOGGER_IS_DRAFT: "false"
          MAX_POSTS_PER_RUN: "1"
        run: |
          python3 -c 'import auto_job_blogger as bot; bot.MAX_POSTS_PER_RUN = 1; bot.main()'

      - name: Save Posted Jobs & Queue State
        run: |
          git config user.name "bdedujob-bot"
          git config user.email "bot@bdedujob.blogspot.com"
          git add posted_jobs.json latest_facebook_posts.txt verified_post_state.json generated_banners/ 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "chore: update posted jobs and verified queue state [skip ci]" && git push)
