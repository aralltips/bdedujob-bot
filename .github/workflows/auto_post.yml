name: Auto Publish BD Job Circulars to Blogger

on:
  # Queue publication stays on the half-hour schedule; no push trigger, so a
  # multi-file upload cannot cause several posts to fire in quick succession.
  schedule:
    - cron: '12,42 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-post-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python & HarfBuzz/Raqm for Bangla Banner
        run: |
          sudo apt-get update
          sudo apt-get install -y libharfbuzz-dev libfribidi-dev libraqm-dev
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync Already Published Jobs
        run: |
          python3 -c '
          import json, os
          f = "posted_jobs.json"
          data = json.load(open(f)) if os.path.exists(f) else []
          for u in [
              "https://bdgovtjob.net/bpatc-job-circular/",
              "https://bdgovtjob.net/saptahik-chakrir-khobor/",
              "https://bdgovtjob.net/bangladesh-krira-shikkha-protishtan-bksp-job-circular/",
              "https://bdgovtjob.net/rajshahi-university-job-circular/",
              "https://bdgovtjob.net/nstu-job-circular/",
              "https://bdgovtjob.net/meherpur-university-job-circular/",
              "https://bdgovtjob.net/ad-din-foundation-job-circular/",
              "https://bdgovtjob.net/popular-pharmaceuticals-ltd-job-circular/",
              "https://bdgovtjob.net/drug-international-limited-job-circular/",
              "https://bdgovtjob.net/bank-asia-limited-job-circular/",
              "https://bdgovtjob.net/bina-written-exam-result-notice/",
              "https://bdgovtjob.net/bpsc-written-examination-notice/"
          ]:
              if u not in data:
                  data.append(u)
          json.dump(data, open(f, "w"), indent=2)
          '

      - name: Publish one verified queued post
        id: verified_queue
        env:
          BLOGGER_BLOG_ID: "3244474783562745180"
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_IS_DRAFT: "false"
          FB_PAGE_ID: "104790438452242"
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: python3 publish_verified_post_queue.py

      - name: Run Auto Job Circular Scraper & Blogger Publisher
        if: steps.verified_queue.outputs.slot_consumed != 'true'
        env:
          BLOGGER_BLOG_ID: "3244474783562745180"
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_PAGE_ID: "104790438452242"
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          BLOGGER_IS_DRAFT: "false"
          MAX_POSTS_PER_RUN: "1"
        run: |
          python3 -c 'import auto_job_blogger as bot; bot.MAX_POSTS_PER_RUN = 1; bot.main()'

      - name: Save Posted Jobs & Generated Banners
        run: |
          git config user.name "bdedujob-bot"
          git config user.email "bot@bdedujob.blogspot.com"
          git add posted_jobs.json latest_facebook_posts.txt verified_post_state.json generated_banners/ 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "chore: update posted jobs and verified queue state [skip ci]" && git push)
